openapi: 3.0.0
info:
  title: Trail Management API
  description: Api for managing trails
  version: "1.0.0"

servers:
  - url: "/api"

components:
  schemas:
    Trail:
      type: object
      properties:
        trailID:
          type: integer
        trailName:
          type: string
        trailSummary:
          type: string
        trailDescription:
          type: string
        difficulty:
          type: string
        location:
          type: string
        length:
          type: number
        elevationGain:
          type: number
        routeType:
          type: string
        ownerID:
          type: integer

    SendTrail:
      type: object
      properties:
        trailName:
          type: string
        trailSummary:
          type: string
        trailDescription:
          type: string
        difficulty:
          type: string
        location:
          type: string
        length:
          type: number
        elevationGain:
          type: number
        routeType:
          type: string
        ownerID:
          type: integer

paths:
  /users/login:
    post:
      summary: Log in
      operationId: authenticate.login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailAddress:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Log in result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                minItems: 2
                maxItems: 2
                example:
                  - "Verified"
                  - "True"
        404:
          description: User does not exist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  
  /users/logout:
    post:
      summary: Log out
      operationId: authenticate.logout
      tags:
        - Authentication
      responses:
        200:
          description: Logged out
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        400:
          description: Failed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /trails:
    get:
      summary: Get all trails
      operationId: trails.read_all
      tags:
        - Trails
      responses:
        200:
          description: A list of trails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trail"
    post:
      summary: Create a trail
      operationId: trails.create
      tags:
        - Trails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTrail"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trail"

  /trails/{trailID}:
    get:
      summary: Get a trail
      operationId: trails.read_one
      tags:
        - Trails
      parameters:
        - name: trailID
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: A trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trail"
        404:
          description: Trail not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    put:
      summary: Update a trail
      operationId: trails.update
      tags:
        - Trails
      parameters:
        - name: trailID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTrail"
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trail"
        404:
          description: Trail not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    delete:
      summary: Delete a trail
      operationId: trails.delete
      tags:
        - Trails
      parameters:
        - name: trailID
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        404:
          description: Trail not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /features:
    get:
      summary: Get all features
      operationId: features.read_all
      tags:
        - Features
      responses:
        200:
          description: A list of features
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    
    post:
      summary: Create a feature
      operationId: features.create
      tags:
        - Features
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                trailFeature:
                  type: string
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: string

  /features/{featureID}:
    get:
      summary: Get a feature
      operationId: features.read_one
      tags:
        - Features
      parameters:
        - name: featureID
          in: path
          required: true
          schema:
              properties:
                trailFeature:
                  type: string
      responses:
        200:
          description: A feature
          content:
            application/json:
              schema:
                type: string
        404:
          description: Feature not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    put:
      summary: Update a feature
      operationId: features.update
      tags:
        - Features
      parameters:
        - name: featureID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                trailFeature:
                  type: string
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: string
        404:
          description: Feature not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    delete:
      summary: Delete a feature
      operationId: features.delete
      tags:
        - Features
      parameters:
        - name: featureID
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        404:
          description: Feature not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

tags:
  - name: Authentication
  - name: Trails
  - name: Features